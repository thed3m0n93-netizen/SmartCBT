# ──────────────────────────────────────────────────────────────────────────────
# SmartCBT — Docker Compose (All-in-One)
#
# Satu file yang build dan menjalankan seluruh stack (PostgreSQL + Backend API
# + Frontend) langsung dari source code lokal. Tidak perlu pull image terlebih
# dahulu — semua image dibangun dari Dockerfile yang ada di repo ini.
#
# Usage:
#   docker compose up -d --build        # build semua image dan nyalakan stack
#   docker compose down                 # matikan semua service
#   docker compose down -v              # matikan + hapus volume (data hilang)
#
# docker logout
# docker login -u devlover0594

# Rebuild image backend (Node.js) dan frontend (Vite + nginx) dari source code lokal:
# docker build -f Dockerfile.backend -t devlover0594/smartcbt-backend:latest .
# Rebuild frontend tanpa prefix API (same-origin)
# docker build -f Dockerfile.frontend --build-arg VITE_API_BASE_URL="" -t devlover0594/smartcbt-frontend:latest .

# Beri tag pada kedua image sesuai format Docker Hub
# docker tag smartcbt-frontend:latest devlover0594/smartcbt-frontend:latest
# docker tag smartcbt-backend:latest devlover0594/smartcbt-backend:latest

# Push kedua image ke Docker Hub
# docker push devlover0594/smartcbt-frontend:latest
# docker push devlover0594/smartcbt-backend:latest

#
# Credentials default (sesuaikan dengan .env jika ada):
#   POSTGRES_USER   = db_smartcbt
#   POSTGRES_PASSWORD = smartcbt123
#   POSTGRES_DB     = db_smartcbt
#   Backend port    = 8447 (di dalam container)
#   Frontend port   = 8080 (di host)
# ──────────────────────────────────────────────────────────────────────────────

name: smartcbt

services:
  # ── PostgreSQL (Database) ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartcbt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: db_smartcbt
      POSTGRES_PASSWORD: smartcbt123
      POSTGRES_DB: db_smartcbt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_smartcbt -d db_smartcbt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - appnet

  # ── Backend API Server (Node.js, pre-built esbuild bundle) ────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartcbt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8447
      HOST: 0.0.0.0
      UPLOADS_DIR: /app/uploads
      PGTYPE: postgres
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: db_smartcbt
      PGPASSWORD: smartcbt123
      PGDATABASE: db_smartcbt
      PGSSL: "false"
      # Jika true, setup-auth.json dihapus dan di-re-seed ke Admin@123 setiap boot.
      SETUP_AUTH_FORCE_DEFAULT: "true"
      # Jika true, database akan di-install dan di-seed otomatis saat backend boot.
      SETUP_AUTO_SEED: "true"
    volumes:
      - uploads-data:/app/uploads
      - server-config:/app/server/dist
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://localhost:8447/api/health',(r)=>{process.exit(r.statusCode===200?0:1);});req.on('error',()=>process.exit(1));req.on('close',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - appnet

  # ── Frontend (Vite build + nginx reverse proxy) ───────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Same-origin: leave empty. api.ts paths already start with `/api` and
        # nginx proxies `/api/` to backend. `/api` here caused `/api/api/*` 401.
        VITE_API_BASE_URL: ""
    container_name: smartcbt-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      # Host:port backend yang akan disubstitusi entrypoint.sh ke dalam
      # nginx config template. Harus sama dengan service "backend" di atas.
      API_HOST: backend:8447
    ports:
      - "8080:80"
    networks:
      - appnet

volumes:
  postgres-data:
  uploads-data:
  server-config:

networks:
  appnet:
    driver: bridge